<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>체스마당 - 온라인 체스</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">♞ 체스마당</a>
  <nav>
    <button class="navbtn" id="navPlay">플레이</button>
    <button class="navbtn" id="navBoard">🏆 순위표</button>
  </nav>
  <div class="spacer"></div>
  <span id="online" class="online"></span>
  <button id="meChip" class="mechip hidden"></button>
</header>

<main>
  <section class="boardcol">
    <div class="pbar" id="topBar"></div>
    <div class="boardwrap">
      <div id="board" class="board"></div>
      <div id="promo" class="promo hidden"></div>
    </div>
    <div class="pbar" id="botBar"></div>
  </section>

  <aside class="panel">
    <!-- 로비 -->
    <div id="lobby">
      <h2>게임 시작</h2>
      <label class="check"><input type="checkbox" id="allowBot" checked> 상대가 없으면 AI와 대전 (8초 후)</label>
      <div id="tcGroups"></div>

      <h3>🤖 컴퓨터와 연습 <small>(레이팅 변동 없음)</small></h3>
      <div class="botform">
        <label>난이도 <b id="lvlVal">1200</b>
          <input type="range" id="lvl" min="400" max="2200" step="200" value="1200"></label>
        <div class="row">
          <select id="botTc"></select>
          <div class="seg" id="botColor">
            <button data-c="w">백</button><button data-c="r" class="on">랜덤</button><button data-c="b">흑</button>
          </div>
        </div>
        <button class="btn primary big" id="botStart">컴퓨터와 시작</button>
      </div>
    </div>

    <!-- 매칭 중 -->
    <div id="queue" class="hidden">
      <div class="spinner"></div>
      <h2>상대를 찾는 중…</h2>
      <p id="queueInfo"></p>
      <button class="btn" id="cancelQueue">취소</button>
    </div>

    <!-- 게임 중 -->
    <div id="gamePanel" class="hidden">
      <div id="gameInfo" class="gameinfo"></div>
      <div id="moves" class="moves"></div>
      <div id="drawBanner" class="banner hidden">
        상대가 무승부를 제안했어요
        <div><button class="btn primary" id="drawYes">수락</button> <button class="btn" id="drawNo">거절</button></div>
      </div>
      <div id="overCard" class="overcard hidden"></div>
      <div class="actions" id="actions">
        <button class="btn" id="flip" title="보드 뒤집기">⇅ 뒤집기</button>
        <button class="btn" id="draw">½ 무승부</button>
        <button class="btn danger" id="resign">🏳 기권</button>
      </div>
      <div class="actions hidden" id="afterActions">
        <button class="btn primary big" id="newGame">새 게임</button>
        <button class="btn" id="flip2">⇅ 뒤집기</button>
      </div>
    </div>
  </aside>
</main>

<div id="toast" class="toast hidden"></div>

<!-- 모달 -->
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>

<script type="module" src="/app.js"></script>
</body>
</html>
